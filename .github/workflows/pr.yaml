name: PR pipeline

on:
  pull_request:

jobs:
  check:
    name: Source Revision
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Checks
        run: npm run check

      - name: Build
        run: npm run build
